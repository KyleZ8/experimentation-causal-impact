[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"cases/*/run_case.py" = ["E402"]
"cases/**/*.ipynb" = ["E402", "I001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
